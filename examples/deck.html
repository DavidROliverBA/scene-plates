<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scene plates</title>
<style>
:root{--bg:#F5F7FA;--ink:#14202E;--muted:#4A5A6A}
@media (prefers-color-scheme:dark){:root{--bg:#0D1520;--ink:#E8EEF5;--muted:#9AA9B8}}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.slide{display:none;height:100%;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.slide[data-on]{display:flex}
h1{font-size:clamp(18px,3vw,34px);font-weight:650;margin:0 0 8px;text-align:center}

.hint{position:fixed;left:0;right:0;bottom:6px;text-align:center;font-size:12px;color:var(--muted)}
@media print{.slide{display:flex;height:auto;break-after:page}.hint{display:none}}
</style></head><body>
<section class="slide" data-on><h1>An agent loop with a cap</h1><scene-plate><script type="application/json">{"title":"An agent loop with a cap","description":"An agent plans, acts and checks its own work. A failed check sends it round again, at most three times, before a person is asked. A passed check finishes the job.","nodes":[{"id":"plan","label":"PLAN","sub":"decide next step","at":[0,0]},{"id":"act","label":"ACT","sub":"call a tool","at":[3.4,0]},{"id":"check","label":"CHECK","sub":"did it work?","kind":"gate","at":[6.8,0]},{"id":"done","label":"DONE","sub":"result returned","kind":"success","at":[10.2,0]},{"id":"person","label":"ASK A PERSON","sub":"out of tries","kind":"fail","at":[6.8,-2.1]}],"groups":[{"id":"agent","label":"AGENT","contains":["plan","act","check"]}],"edges":[{"from":"plan","to":"act"},{"from":"act","to":"check"},{"from":"check","to":"done","kind":"pass","label":"pass"},{"from":"check","to":"plan","kind":"loop","via":"y","channel":1.75,"label":"try again, max 3 times","hold":true},{"from":"check","to":"person","kind":"fail","label":"3 fails","hold":true}],"steps":[{"caption":"The agent plans a step, acts on it, then checks the result.","show":["agent"],"pulse":["plan>act","act>check"]},{"caption":"A failed check sends it round again, but never more than three times.","show":["check>plan"],"pulse":["check>plan"],"camera":{"pitch":46}},{"caption":"After three failures it stops and asks a person.","show":["person","check>person"],"focus":["check","person"],"pulse":["check>person"]},{"caption":"A passed check ends the loop and returns the result.","show":["done"],"focus":["check","done"],"pulse":["check>done"]},{"caption":"The loop is closed by a check and bounded by a cap.","camera":{"pitch":38}}]}</script></scene-plate></section>
<section class="slide"><h1>A request through the gateway</h1><scene-plate><script type="application/json">{"title":"A request through the gateway","description":"A client request passes a gateway check, reaches a service, and the service reads from a cache and a database on the layer below. Requests that fail the check are rejected.","nodes":[{"id":"client","label":"CLIENT","sub":"web or phone","at":[0,0],"layer":1},{"id":"gateway","label":"GATEWAY","sub":"checks the token","kind":"gate","at":[3.4,0],"layer":1},{"id":"service","label":"SERVICE","sub":"does the work","at":[6.8,0],"layer":1},{"id":"reject","label":"REJECTED","sub":"401, nothing runs","kind":"fail","at":[3.4,-2],"layer":1},{"id":"cache","label":"CACHE","sub":"recent answers","kind":"quiet","at":[3.4,0],"layer":0},{"id":"db","label":"DATABASE","sub":"source of truth","kind":"success","at":[6.8,0],"layer":0}],"groups":[{"id":"app","label":"APPLICATION","contains":["client","gateway","service","reject"]},{"id":"data","label":"DATA","contains":["cache","db"]}],"edges":[{"from":"client","to":"gateway","label":"request"},{"from":"gateway","to":"service","kind":"pass","label":"valid"},{"from":"gateway","to":"reject","kind":"fail","label":"invalid"},{"from":"service","to":"db","label":"read"},{"from":"db","to":"cache","kind":"quiet","label":"warms"}],"steps":[{"caption":"Every request starts at the client.","show":["client"]},{"caption":"The gateway checks the token before anything else runs.","show":["gateway"],"pulse":["client>gateway"]},{"caption":"A bad token stops here. Nothing behind the gateway is touched.","show":["reject"],"focus":["gateway","reject"],"pulse":["gateway>reject"]},{"caption":"A good token goes through to the service.","show":["service"],"pulse":["gateway>service"]},{"caption":"The service reads from the data layer underneath.","show":["data"],"focus":["service","db"],"pulse":["service>db"],"camera":{"yaw":32,"pitch":32}},{"caption":"The whole path: checked once, then served from data.","camera":{"yaw":22,"pitch":38}}]}</script></scene-plate></section>
<div class="hint">Right arrow, space or click: next step. Left arrow: back.</div>
