<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scene plates</title>
<style>
:root{--bg:#F5F7FA;--ink:#14202E;--muted:#4A5A6A}
@media (prefers-color-scheme:dark){:root{--bg:#0D1520;--ink:#E8EEF5;--muted:#9AA9B8}}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.slide{display:none;height:100%;align-items:center;justify-content:center;padding:8px 8px 28px}
.slide[data-on]{display:flex}
scene-plate{display:block;width:min(100%,calc((100vh - 40px)*16/9));cursor:pointer;outline:none}
.hint{position:fixed;left:0;right:0;bottom:6px;text-align:center;font-size:12px;color:var(--muted)}
@media print{.slide{display:flex;height:auto;break-after:page}.hint,button{display:none}}
</style></head><body>
<section class="slide" data-on><scene-plate toggle><script type="application/json">{"title":"Approving an expense","subtitle":"Simple flowchart: one decision, two outcomes","description":"An expense claim is checked against a limit. Small claims are paid at once; larger ones go to a manager, who approves or refuses them.","nodes":[{"id":"submit","label":"SUBMIT CLAIM","sub":"receipt attached","at":[0,0],"size":[2.6,1],"icon":"document"},{"id":"limit","label":"UNDER £500?","sub":"automatic check","kind":"gate","at":[4,0],"size":[2.6,1],"icon":"check"},{"id":"pay","label":"PAID","sub":"in next payroll","kind":"success","at":[8,0],"size":[2.6,1],"icon":"card"},{"id":"manager","label":"MANAGER","sub":"reviews the claim","at":[4,2.2],"size":[2.6,1],"icon":"user"},{"id":"refused","label":"REFUSED","sub":"sent back with reason","kind":"fail","at":[0,2.2],"size":[2.6,1],"icon":"stop"}],"edges":[{"from":"submit","to":"limit"},{"from":"limit","to":"pay","kind":"pass","label":"yes"},{"from":"limit","to":"manager","label":"no"},{"from":"manager","to":"pay","kind":"pass","via":"xy","label":"approved"},{"from":"manager","to":"refused","kind":"fail","label":"refused"}],"callouts":[{"id":"why","text":"The limit is a rule, not a judgement, so no person is needed here.","on":"limit","side":"up"}],"steps":[{"caption":"Someone submits an expense claim.","show":["submit"]},{"caption":"Claims under £500 are checked automatically and paid.","show":["limit","pay"],"pulse":["submit>limit","limit>pay"],"callout":["why"]},{"caption":"Larger claims go to a manager.","show":["manager"],"focus":["limit","manager"],"pulse":["limit>manager"]},{"caption":"The manager approves the claim, or refuses it with a reason.","show":["refused"],"focus":["manager","pay","refused"],"pulse":["manager>pay","manager>refused"]},{"caption":"Two routes to being paid, one route to refusal."}]}</script></scene-plate></section>
<section class="slide"><scene-plate toggle><script type="application/json">{"title":"Handling an order","subtitle":"Complex flowchart: two capped loops and one way to fail","description":"An order is checked for stock, paid for with up to three attempts, then picked, packed and shipped by the warehouse. Out-of-stock orders wait; failed payments cancel the order.","nodes":[{"id":"order","label":"ORDER PLACED","sub":"basket confirmed","at":[0,0]},{"id":"stock","label":"IN STOCK?","sub":"check warehouse","kind":"gate","at":[3.4,0]},{"id":"wait","label":"WAIT","sub":"until restocked","kind":"quiet","at":[3.4,-2.3]},{"id":"charge","label":"TAKE PAYMENT","sub":"card or wallet","at":[6.8,0]},{"id":"paid","label":"PAID?","sub":"bank answers","kind":"gate","at":[10.2,0]},{"id":"cancel","label":"CANCELLED","sub":"customer told why","kind":"fail","at":[10.2,-2.3]},{"id":"pick","label":"PICK","sub":"from the shelves","at":[10.2,2.4]},{"id":"pack","label":"PACK","sub":"box and label","at":[6.8,2.4]},{"id":"ship","label":"SHIP","sub":"hand to courier","at":[3.4,2.4]},{"id":"done","label":"DELIVERED","sub":"signed for","kind":"success","at":[0,2.4]}],"groups":[{"id":"checkout","label":"CHECKOUT","contains":["charge","paid"]},{"id":"warehouse","label":"WAREHOUSE","contains":["pick","pack","ship"]}],"edges":[{"from":"order","to":"stock"},{"from":"stock","to":"wait","label":"no","offset":-0.4,"flip":true},{"from":"wait","to":"stock","kind":"loop","label":"daily, max 14","offset":0.4},{"from":"stock","to":"charge","kind":"pass","label":"yes"},{"from":"charge","to":"paid"},{"from":"paid","to":"charge","kind":"loop","via":"y","channel":-0.95,"offset":-0.5,"label":"declined, max 3 tries","hold":true},{"from":"paid","to":"cancel","kind":"fail","label":"3 fails","offset":0.5,"hold":true},{"from":"paid","to":"pick","kind":"pass","label":"yes"},{"from":"pick","to":"pack"},{"from":"pack","to":"ship"},{"from":"ship","to":"done","kind":"pass"}],"callouts":[{"id":"cap","text":"Every loop states its cap. Three tries, then stop.","on":"charge","side":"down","gap":70}],"steps":[{"caption":"An order arrives and the warehouse is checked for stock.","show":["order","stock"],"pulse":["order>stock"]},{"caption":"Out of stock? The order waits and re-checks daily, for 14 days at most.","show":["wait"],"focus":["stock","wait"],"pulse":["stock>wait","wait>stock"]},{"caption":"In stock: checkout takes the payment and the bank answers.","show":["checkout"],"focus":["stock","checkout"],"pulse":["stock>charge","charge>paid"]},{"caption":"A declined card is retried, but never more than three times.","show":["paid>charge"],"focus":["checkout"],"pulse":["paid>charge"],"camera":{"target":["checkout"],"zoom":1.35},"callout":["cap"]},{"caption":"After three failures the order is cancelled and the customer is told.","show":["cancel","paid>cancel"],"focus":["paid","cancel"],"pulse":["paid>cancel"]},{"caption":"Once paid, the warehouse picks, packs and ships.","show":["warehouse"],"focus":["paid","warehouse"],"pulse":["paid>pick","pick>pack","pack>ship"],"camera":{"target":null,"zoom":1}},{"caption":"The courier delivers, and the order is complete.","show":["done"],"focus":["ship","done"],"pulse":["ship>done"]},{"caption":"One happy path, two capped loops, one way to fail."}]}</script></scene-plate></section>
<section class="slide"><scene-plate toggle><script type="application/json">{"title":"A serverless web app","subtitle":"Simple AWS: one layer, no servers to run","description":"People reach a serverless web app through CloudFront. Static pages come from S3; API calls go through API Gateway to a Lambda function that stores data in DynamoDB.","nodes":[{"id":"users","label":"PEOPLE","sub":"browser or phone","kind":"quiet","at":[0,0],"size":[2.6,1],"icon":"user"},{"id":"cdn","label":"CLOUDFRONT","sub":"one front door","at":[3.8,0],"size":[2.6,1],"icon":"globe"},{"id":"site","label":"S3","sub":"the static pages","kind":"quiet","at":[7.5,-2.2],"size":[2.6,1],"icon":"storage"},{"id":"api","label":"API GATEWAY","sub":"checks each call","kind":"gate","at":[7.5,0],"size":[2.6,1],"icon":"gateway"},{"id":"fn","label":"LAMBDA","sub":"runs the logic","at":[11.2,0],"size":[2.6,1],"icon":"function"},{"id":"table","label":"DYNAMODB","sub":"keeps the data","kind":"success","at":[11.2,2.2],"size":[2.6,1],"icon":"database","shape":"cylinder"}],"groups":[{"id":"aws","label":"AWS  eu-west-2","contains":["cdn","site","api","fn","table"]}],"edges":[{"from":"users","to":"cdn","label":"https"},{"from":"cdn","to":"site","via":"yx","label":"pages"},{"from":"cdn","to":"api","label":"/api"},{"from":"api","to":"fn","kind":"pass"},{"from":"fn","to":"table","label":"read, write"}],"callouts":[{"id":"door","text":"One address for pages and API, so no cross-site rules to manage.","on":"cdn","side":"down","gap":70}],"steps":[{"caption":"Everything people do goes through one front door, CloudFront.","show":["users","cdn"],"pulse":["users>cdn"]},{"caption":"Pages, scripts and images are plain files served from S3.","show":["site"],"focus":["cdn","site"],"pulse":["cdn>site"]},{"caption":"Calls to /api go to API Gateway, which checks each one.","show":["api"],"focus":["cdn","api"],"pulse":["cdn>api"],"callout":["door"]},{"caption":"A Lambda function runs the logic and keeps data in DynamoDB.","show":["fn","table"],"focus":["api","fn","table"],"pulse":["api>fn","fn>table"]},{"caption":"No servers to run: every part scales on its own and bills per use."}]}</script></scene-plate></section>
<section class="slide"><scene-plate toggle><script type="application/json">{"title":"AWS landscape: edge, network and data","description":"A three-layer AWS landscape. At the edge, CloudFront and a web firewall filter traffic. In the VPC, a load balancer in a public subnet feeds an API and a worker in a private subnet. Underneath, Aurora, a read replica and S3 hold the data.","camera":{"pitch":40},"nodes":[{"id":"users","label":"PEOPLE","sub":"anywhere","kind":"quiet","at":[0,0],"layer":2},{"id":"cdn","label":"CLOUDFRONT","sub":"caches near people","at":[3.6,0],"layer":2},{"id":"waf","label":"WAF","sub":"filters bad traffic","kind":"gate","at":[7.6,0],"layer":2},{"id":"blocked","label":"BLOCKED","sub":"bots and attacks","kind":"fail","at":[11.2,0],"layer":2},{"id":"alb","label":"LOAD BALANCER","sub":"spreads requests","at":[7.6,0],"layer":1},{"id":"api","label":"API","sub":"containers on ECS","at":[3.6,0],"layer":1},{"id":"worker","label":"WORKER","sub":"slow jobs","at":[0,0],"layer":1},{"id":"db","label":"AURORA","sub":"orders, accounts","kind":"success","at":[3.6,0],"layer":0,"shape":"cylinder"},{"id":"replica","label":"REPLICA","sub":"read-only copy","kind":"quiet","at":[7.6,0],"layer":0,"shape":"cylinder"},{"id":"files","label":"S3","sub":"reports, exports","kind":"success","at":[0,0],"layer":0}],"groups":[{"id":"edge","label":"EDGE","contains":["cdn","waf","blocked"]},{"id":"public","label":"PUBLIC SUBNET","contains":["alb"]},{"id":"private","label":"PRIVATE SUBNET","contains":["api","worker"]},{"id":"vpc","label":"VPC","contains":["public","private"]},{"id":"data","label":"DATA","contains":["db","replica","files"]}],"edges":[{"from":"users","to":"cdn","label":"https"},{"from":"cdn","to":"waf"},{"from":"waf","to":"blocked","kind":"fail","label":"deny"},{"from":"waf","to":"alb","kind":"pass","label":"allow"},{"from":"alb","to":"api"},{"from":"api","to":"worker","label":"queue"},{"from":"api","to":"db","label":"sql"},{"from":"worker","to":"files","label":"write"},{"from":"db","to":"replica","kind":"quiet","label":"copies"}],"callouts":[{"id":"gate","text":"The only way in. Nothing below has a public address.","on":"waf","side":"up","gap":44}],"steps":[{"caption":"The edge: CloudFront serves people from a location near them.","show":["users","cdn"],"pulse":["users>cdn"]},{"caption":"A web firewall filters every request. Bad traffic stops here.","show":["waf","blocked"],"focus":["waf","blocked"],"pulse":["cdn>waf","waf>blocked"],"callout":["gate"]},{"caption":"Allowed traffic drops into the VPC through a public load balancer.","show":["public"],"focus":["waf","alb"],"pulse":["waf>alb"]},{"caption":"The API and its worker sit in a private subnet, out of reach of the internet.","show":["private"],"focus":["alb","api","worker"],"pulse":["alb>api","api>worker"],"camera":{"pitch":33}},{"caption":"The data layer sits underneath: Aurora, its replica, and S3.","show":["data"],"focus":["api","worker","data"],"pulse":["api>db","worker>files","db>replica"]},{"caption":"Three layers, one way in, and data that only private code can touch.","camera":{"pitch":40}}]}</script></scene-plate></section>
<section class="slide"><scene-plate toggle><script type="application/json">{"title":"An event-driven write path","subtitle":"AWS drawn flat, from straight above.","view":"flat","description":"An API Gateway call triggers a Lambda that writes to DynamoDB. Failed events go to a dead-letter queue. On the layer below, a table stream feeds an indexer that keeps OpenSearch up to date.","nodes":[{"id":"client","label":"CLIENT","sub":"sends a change","kind":"quiet","at":[0,0],"layer":1,"size":[2.6,1],"icon":"user"},{"id":"api","label":"API GATEWAY","sub":"validates input","kind":"gate","at":[3.7,0],"layer":1,"size":[2.6,1],"icon":"gateway"},{"id":"fn","label":"LAMBDA","sub":"applies the change","at":[7.4,0],"layer":1,"size":[2.6,1],"icon":"function"},{"id":"dlq","label":"SQS DLQ","sub":"kept for replay","kind":"fail","at":[11.1,0],"layer":1,"size":[2.6,1],"icon":"queue"},{"id":"table","label":"DYNAMODB","sub":"source of truth","kind":"success","at":[7.4,0],"layer":0,"size":[2.6,1],"icon":"database","shape":"cylinder"},{"id":"indexer","label":"INDEXER","sub":"lambda on stream","at":[3.7,0],"layer":0,"size":[2.6,1],"icon":"bolt"},{"id":"search","label":"OPENSEARCH","sub":"fast lookups","kind":"quiet","at":[0,0],"layer":0,"size":[2.6,1],"icon":"search"}],"groups":[{"id":"write","label":"WRITE PATH","contains":["api","fn","dlq"]},{"id":"read","label":"DATA AND SEARCH","contains":["table","indexer","search"]}],"edges":[{"from":"client","to":"api","label":"POST"},{"from":"api","to":"fn","kind":"pass","label":"valid"},{"from":"fn","to":"dlq","kind":"fail","label":"3 errors"},{"from":"fn","to":"table","label":"write"},{"from":"table","to":"indexer","label":"stream"},{"from":"indexer","to":"search","label":"index"}],"callouts":[{"id":"replay","text":"Nothing is lost: a person can fix the cause and replay the queue.","on":"dlq","side":"down","gap":56}],"steps":[{"caption":"A client sends a change. API Gateway validates it first.","show":["client","api"],"pulse":["client>api"]},{"caption":"A Lambda function applies the change.","show":["fn"],"focus":["api","fn"],"pulse":["api>fn"]},{"caption":"An event that fails three times is parked in a queue for replay.","show":["dlq"],"focus":["fn","dlq"],"pulse":["fn>dlq"],"callout":["replay"]},{"caption":"A good change is written to DynamoDB, the source of truth.","show":["table"],"focus":["fn","table"],"pulse":["fn>table"]},{"caption":"The table's stream feeds an indexer, which keeps search up to date.","show":["indexer","search"],"focus":["read"],"pulse":["table>indexer","indexer>search"]},{"caption":"Writes go one way; search catches up a moment later."}]}</script></scene-plate></section>

<section class="slide"><scene-plate toggle><script type="application/json">{"title":"A request through the gateway","subtitle":"Two layers and a fail path","description":"A client request passes a gateway check, reaches a service, and the service reads from a cache and a database on the layer below. Requests that fail the check are rejected.","nodes":[{"id":"client","label":"CLIENT","sub":"web or phone","at":[0,0],"layer":1},{"id":"gateway","label":"GATEWAY","sub":"checks the token","kind":"gate","at":[3.4,0],"layer":1},{"id":"service","label":"SERVICE","sub":"does the work","at":[6.8,0],"layer":1},{"id":"reject","label":"REJECTED","sub":"401, nothing runs","kind":"fail","at":[3.4,-2],"layer":1},{"id":"cache","label":"CACHE","sub":"recent answers","kind":"quiet","at":[3.4,0],"layer":0},{"id":"db","label":"DATABASE","sub":"source of truth","kind":"success","at":[6.8,0],"layer":0}],"groups":[{"id":"app","label":"APPLICATION","contains":["client","gateway","service","reject"]},{"id":"data","label":"DATA","contains":["cache","db"]}],"edges":[{"from":"client","to":"gateway","label":"request"},{"from":"gateway","to":"service","kind":"pass","label":"valid"},{"from":"gateway","to":"reject","kind":"fail","label":"invalid"},{"from":"service","to":"db","label":"read"},{"from":"db","to":"cache","kind":"quiet","label":"warms"}],"steps":[{"caption":"Every request starts at the client.","show":["client"]},{"caption":"The gateway checks the token before anything else runs.","show":["gateway"],"pulse":["client>gateway"]},{"caption":"A bad token stops here. Nothing behind the gateway is touched.","show":["reject"],"focus":["gateway","reject"],"pulse":["gateway>reject"]},{"caption":"A good token goes through to the service.","show":["service"],"pulse":["gateway>service"]},{"caption":"The service reads from the data layer underneath.","show":["data"],"focus":["service","db"],"pulse":["service>db"],"camera":{"pitch":32}},{"caption":"The whole path: checked once, then served from data.","camera":{"pitch":38}}]}</script></scene-plate></section>
<section class="slide"><scene-plate toggle><script type="application/json">{"title":"An agent loop with a cap","subtitle":"A loop closed by a check and bounded by a cap","description":"An agent plans, acts and checks its own work. A failed check sends it round again, at most three times, before a person is asked. A passed check finishes the job.","nodes":[{"id":"plan","label":"PLAN","sub":"decide next step","at":[0,0]},{"id":"act","label":"ACT","sub":"call a tool","at":[3.4,0]},{"id":"check","label":"CHECK","sub":"did it work?","kind":"gate","at":[6.8,0]},{"id":"done","label":"DONE","sub":"result returned","kind":"success","at":[10.2,0]},{"id":"person","label":"ASK A PERSON","sub":"out of tries","kind":"fail","at":[6.8,-2.1]}],"groups":[{"id":"agent","label":"AGENT","contains":["plan","act","check"]}],"edges":[{"from":"plan","to":"act"},{"from":"act","to":"check"},{"from":"check","to":"done","kind":"pass","label":"pass"},{"from":"check","to":"plan","kind":"loop","via":"y","channel":1.75,"label":"try again, max 3 times","hold":true},{"from":"check","to":"person","kind":"fail","label":"3 fails","hold":true}],"steps":[{"caption":"The agent plans a step, acts on it, then checks the result.","show":["agent"],"pulse":["plan>act","act>check"]},{"caption":"A failed check sends it round again, but never more than three times.","show":["check>plan"],"pulse":["check>plan"],"camera":{"pitch":46}},{"caption":"After three failures it stops and asks a person.","show":["person","check>person"],"focus":["check","person"],"pulse":["check>person"]},{"caption":"A passed check ends the loop and returns the result.","show":["done"],"focus":["check","done"],"pulse":["check>done"]},{"caption":"The loop is closed by a check and bounded by a cap.","camera":{"pitch":38}}]}</script></scene-plate></section>
<section class="slide"><scene-plate toggle><script type="application/json">{"title":"A retail platform in fifty components","subtitle":"Stress test: an overview you cannot read, then a guided tour you can","description":"A retail platform of fifty components in thirteen areas: channels, edge, identity, content, catalogue, checkout, finance, fulfilment, customer, messaging, support, analytics and operations. Orders flow from the gateway through checkout and payment to the order service, whose events feed messaging and analytics.","camera":{"pitch":50},"nodes":[{"id":"shoppers","label":"SHOPPERS","sub":"people buying","kind":"quiet","icon":"user","at":[0,-2.8],"size":[2.6,1]},{"id":"blocked","label":"BLOCKED","sub":"bots and attacks","kind":"fail","icon":"stop","at":[12,-2.8],"size":[2.6,1]},{"id":"partners","label":"PARTNERS","sub":"marketplaces","kind":"quiet","icon":"globe","at":[16,-2.8],"size":[2.6,1]},{"id":"mobile","label":"MOBILE APP","sub":"iOS and Android","icon":"code","at":[0,0],"size":[2.6,1]},{"id":"web","label":"WEB SHOP","sub":"browser storefront","icon":"globe","at":[4,0],"size":[2.6,1]},{"id":"cdn","label":"CDN","sub":"caches near people","icon":"cloud","at":[8,0],"size":[2.6,1]},{"id":"waf","label":"WEB FIREWALL","sub":"filters bad traffic","kind":"gate","icon":"shield","at":[12,0],"size":[2.6,1]},{"id":"apigw","label":"API GATEWAY","sub":"one way in","kind":"gate","icon":"gateway","at":[16,0],"size":[2.6,1]},{"id":"identity","label":"IDENTITY","sub":"who is calling?","kind":"gate","icon":"lock","at":[20,0],"size":[2.6,1]},{"id":"tokens","label":"TOKEN STORE","sub":"live sessions","kind":"quiet","icon":"database","at":[24,0],"size":[2.6,1],"shape":"cylinder"},{"id":"keys","label":"KEY VAULT","sub":"signing keys","kind":"quiet","icon":"lock","at":[28,0],"size":[2.6,1]},{"id":"cms","label":"CONTENT EDITOR","sub":"pages and banners","icon":"document","at":[0,2.8],"size":[2.6,1]},{"id":"media","label":"MEDIA STORE","sub":"images and video","kind":"quiet <section class="slide"><scene-plate toggle><script type="application/json">{"title":"Popular AWS services, and how the lines are routed","subtitle":"Each step shows one routing rule","description":"Twenty-seven AWS services on a grid: an edge of CloudFront and WAF; API Gateway with Cognito; compute in Step Functions, Lambda and ECS; data in DynamoDB, ElastiCache and Aurora; messaging through SQS, EventBridge, SNS and SES; analytics with Athena over S3. The steps explain the rules that keep twenty-nine connecting lines from crossing.","camera":{"pitch":46},"nodes":[{"id":"dns","label":"ROUTE 53","sub":"names to addresses","kind":"quiet","icon":"globe","at":[0,0],"size":[2.6,1]},{"id":"site","label":"S3 SITE","sub":"static pages","kind":"quiet","icon":"storage","at":[12,0],"size":[2.6,1],"shape":"cylinder"},{"id":"ai","label":"BEDROCK","sub":"model calls","icon":"bolt","at":[16,0],"size":[2.6,1]},{"id":"athena","label":"ATHENA","sub":"SQL over files","icon":"search","at":[20,0],"size":[2.6,1]},{"id":"lake","label":"S3 DATA","sub":"results and files","kind":"success","icon":"storage","at":[24,0],"size":[2.6,1],"shape":"cylinder"},{"id":"cognito","label":"COGNITO","sub":"who is calling?","kind":"gate","icon":"lock","at":[12,2.8],"size":[2.6,1]},{"id":"flow","label":"STEP FUNCTIONS","sub":"long-running jobs","icon":"gear","at":[16,2.8],"size":[2.6,1]},{"id":"queue","label":"SQS","sub":"work waiting","kind":"quiet","icon":"queue","at":[20,2.8],"size":[2.6,1]},{"id":"worker","label":"WORKER","sub":"lambda on queue","icon":"function","at":[24,2.8],"size":[2.6,1]},{"id":"users","label":"PEOPLE","sub":"browser or phone","kind":"quiet","icon":"user","at":[0,5.6],"size":[2.6,1]},{"id":"cdn","label":"CLOUDFRONT","sub":"one front door","icon":"cloud","at":[4,5.6],"size":[2.6,1]},{"id":"waf","label":"WAF","sub":"filters traffic","kind":"gate","icon":"shield","at":[8,5.6],"size":[2.6,1]},{"id":"api","label":"API GATEWAY","sub":"routes each call","kind":"gate","icon":"gateway","at":
